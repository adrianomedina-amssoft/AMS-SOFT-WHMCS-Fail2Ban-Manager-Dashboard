# Install as /etc/apache2/conf-available/amssoft_fail2ban.conf and enable with
# a2enconf amssoft_fail2ban. Adjust this absolute module path for other hosts.
# Server-level protection also applies to vhosts with AllowOverride None.
<Directory "/var/www/html/whmcs/modules/addons/amssoft_fail2ban">
    Options -Indexes
    <FilesMatch "(?i)(?:^\.|\.bakp?(?:\.|$)|^(?:CLAUDE|AGENTS)\.md$)">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/var/www/html/whmcs/modules/addons/amssoft_fail2ban/(?:(?:[^/]+/)*\.[^/]+|tests|scripts|setup|sql|docs|data|lib|controllers|templates)(?:/|$)">
    AllowOverride None
    Require all denied
</DirectoryMatch>
