# Examples only: insert the appropriate CustomLog INSIDE each existing port-80
# VirtualHost. Do not enable this file globally or duplicate the VirtualHost.
# These are existing combined sources approved by the module and root bridge.
# Loja HTTP redirect -> same source already used by its HTTPS virtualhost:
#     CustomLog ${APACHE_LOG_DIR}/access_whmcs.log combined
# Gateway HTTP redirect -> same source already used by its HTTPS virtualhost:
#     CustomLog ${APACHE_LOG_DIR}/access_license_gateway.log combined
# Preserve ServerName/ServerAlias/Redirect and all existing TLS/PHP directives.
# Check apache2ctl configtest, reload Apache gracefully, then run the root-only
# scripts/http_redirect_audit.py and a benign local request to verify logging.
# Merely adding other_vhosts_access.log to apache-sensitive is insufficient:
# vhost_combined prepends server:port before the peer and needs its own parser.
