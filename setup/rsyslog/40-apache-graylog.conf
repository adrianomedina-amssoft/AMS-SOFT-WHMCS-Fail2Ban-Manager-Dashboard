# Existing Apache inputs and destination preserved. Independent bounded remote queue.
module(load="imfile")
input(type="imfile" File="/var/log/apache2/access.log" Tag="apache_access"
      PersistStateInterval="200" ReadMode="2")
input(type="imfile" File="/var/log/apache2/error.log" Tag="apache_error"
      PersistStateInterval="200" ReadMode="2")
if ($programname == "apache_access" or $programname == "apache_error") then {
  action(type="omfwd" name="amsfb_apache_graylog"
         target="graylog.example.invalid" port="5144" protocol="tcp"
         template="RSYSLOG_SyslogProtocol23Format"
         action.resumeRetryCount="-1"
         queue.type="LinkedList" queue.filename="amsfb_apache_graylog"
         queue.size="10000" queue.highWatermark="8000" queue.lowWatermark="2000"
         queue.maxDiskSpace="256m" queue.maxFileSize="16m"
         queue.saveOnShutdown="on" queue.timeoutEnqueue="0")
  # Only the remote copy may be discarded if this queue reaches its bounded
  # capacity. Original Apache files and local auth/syslog actions remain local.
  stop
}
